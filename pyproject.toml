[project]
name = "cms"
version = "0.2.0"
description = "Camera Management System — open RTSP camera feeds in VLC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
cms     = "cms.cli:main"
cms-gui = "cms.gui:run_gui"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cms"]
